[build]
target = "thumbv6m-none-eabi"

[target.thumbv6m-none-eabi]
# Flash + run over SWD (J2 header) with probe-rs; alternatively hold BOOTSEL
# (BOOT0) while plugging USB and use `dfu-util` — see README.md.
runner = "probe-rs run --chip STM32F072CBTx"
rustflags = ["-C", "link-arg=-Tlink.x", "-C", "link-arg=-Tdefmt.x"]

[env]
# Our own crate at debug (joystick raw values, touch charge time, executor
# heartbeat); embassy stays at info so the stream is readable. `off` strips
# all logging from the build.
DEFMT_LOG = "info,openmicro_fw=debug"
